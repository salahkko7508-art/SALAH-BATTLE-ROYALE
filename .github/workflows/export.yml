name: Export Web
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p web
      - run: godot --headless --export-release "Web" web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web
