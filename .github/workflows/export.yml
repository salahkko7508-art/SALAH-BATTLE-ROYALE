name: Export Web
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - run: mkdir -p web
      - run: godot --headless --import --export-release "Web" web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web
